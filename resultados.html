<div class="resultado-container">

    <div class="resultado-topo">

        <h2>⚽ Central de Resultados</h2>

        <p>
            Administração oficial dos resultados da Copa do Mundo 2026
        </p>

    </div>

    <div class="resultado-dashboard">

        <div class="dash-card">

            <span>⚽ Jogos</span>

            <strong id="dashJogos">0</strong>

        </div>

        <div class="dash-card">

            <span>✅ Finalizados</span>

            <strong id="dashFinalizados">0</strong>

        </div>

        <div class="dash-card">

            <span>⏳ Pendentes</span>

            <strong id="dashPendentes">0</strong>

        </div>

        <div class="dash-card">

            <span>🏆 Fase</span>

            <strong id="dashFase">Grupos</strong>

        </div>

    </div>

    <div class="resultado-filtros">

        <input
            id="pesquisaResultado"
            type="text"
            placeholder="🔍 Procurar seleção..."
        >

        <select id="filtroFase">

            <option value="todos">
                Todas as fases
            </option>

            <option value="Grupos">
                Fase de Grupos
            </option>

            <option value="Oitavas">
                Oitavas
            </option>

            <option value="Quartas">
                Quartas
            </option>

            <option value="Semifinal">
                Semifinal
            </option>

            <option value="Final">
                Final
            </option>

        </select>

    </div>

    <div id="gradeResultados"></div>

    <hr style="margin:40px 0;border:1px solid rgba(255,255,255,.15);">

    <div class="resultadoExtras">

        <h2>🏆 Resultado Oficial dos Extras</h2>

        <div class="extrasGrid">

            <div class="extraCampo">

                <label>Campeão</label>

                <select id="resCampeao"></select>

            </div>

            <div class="extraCampo">

                <label>Vice-Campeão</label>

                <select id="resVice"></select>

            </div>

            <div class="extraCampo">

                <label>Artilheiro</label>

                <input
                    id="resArtilheiro"
                    type="text"
                    placeholder="Nome do jogador"
                >

            </div>

            <div class="extraCampo">

                <label>Gols do Brasil</label>

                <input
                    id="resGolsBrasil"
                    type="number"
                    min="0"
                >

            </div>

            <div class="extraCampo">

                <label>Fase do Brasil</label>

                <select id="resFaseBrasil">

                    <option value="">Selecione</option>

                    <option value="Grupos">
                        Fase de Grupos
                    </option>

                    <option value="SEG">
                        16 Avos
                    </option>

                    <option value="OIT">
                        Oitavas
                    </option>

                    <option value="QUA">
                        Quartas
                    </option>

                    <option value="SEM">
                        Semifinal
                    </option>

                    <option value="VICE">
                        Vice-Campeão
                    </option>

                    <option value="CAMPEAO">
                        Campeão
                    </option>

                </select>

            </div>

        </div>

        <button
            class="btnSalvarNovo"
            onclick="salvarResultadoExtras()"
        >
            💾 Salvar Resultado Oficial
        </button>

    </div>

</div>
