<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Backup Firebase</title>

</head>

<body>

<h2>Backup Firebase</h2>

<button onclick="exportarUsuarios()">

Exportar Usuários

</button>

  <button onclick="exportarJogos()">

Exportar Jogos

</button>

<script type="module">

import "./firebase.js";

  async function exportarUsuarios(){

  const snapshot = await window.getDocs(
    window.collection(window.db,"usuarios")
  );

  const dados = [];

  snapshot.forEach(doc=>{

    dados.push({
      id:doc.id,
      ...doc.data()
    });

  });

  if(dados.length==0){
    alert("Nenhum usuário encontrado.");
    return;
  }

  const cabecalho = Object.keys(dados[0]);

  const linhas = dados.map(obj=>

    cabecalho.map(c=>{

      let valor = obj[c];

      if(typeof valor==="object")
        valor = JSON.stringify(valor);

      return `"${String(valor??"").replace(/"/g,'""')}"`;

    }).join(",")

  );

  const csv = [

    cabecalho.join(","),

    ...linhas

  ].join("\n");

  const blob = new Blob(
    [csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download =
    "usuarios.csv";

  link.click();

}

async function exportarJogos(){

  const snapshot = await window.getDocs(
    window.collection(window.db,"jogos")
  );

  const dados = [];

  snapshot.forEach(doc=>{

    dados.push({

  if(dados.length==0){

  const csv = [

    cabecalho.join(","),

  const blob = new Blob(

  link.click();

}

window.exportarJogos =
exportarJogos;
  
window.exportarUsuarios =
exportarUsuarios;

</script>

</body>

</html>
