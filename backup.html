<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Backup Firebase</title>

<style>

body{

    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    padding:40px;

}

h1{

    color:#0b4f8a;

}

button{

    display:block;
    width:250px;
    margin:15px 0;
    padding:15px;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#0b4f8a;
    color:#fff;

}

button:hover{

    background:#083a66;

}

</style>

</head>

<body>

<h1>Backup Firebase</h1>

<button onclick="exportarUsuarios()">
👥 Exportar Usuários
</button>

<button onclick="exportarJogos()">
⚽ Exportar Jogos
</button>

<button onclick="exportarPalpites()">
📝 Exportar Palpites
</button>

<button onclick="exportarTudo()">
🚀 Exportar Tudo
</button>

<script type="module">

import "./firebase.js";

async function exportarColecao(nomeColecao){

    try{

        const snapshot = await window.getDocs(

            window.collection(
                window.db,
                nomeColecao
            )

        );

        const dados=[];

        snapshot.forEach(doc=>{

            dados.push({

                id:doc.id,

                ...doc.data()

            });

        });

        if(dados.length===0){

            alert("Nenhum dado encontrado em "+nomeColecao);

            return;

        }

        const cabecalho = Object.keys(dados[0]);

        const linhas = dados.map(obj=>

            cabecalho.map(c=>{

                let valor=obj[c];

                if(typeof valor==="object")
                    valor=JSON.stringify(valor);

                return `"${String(valor??"").replace(/"/g,'""')}"`;

            }).join(",")

        );

        const csv=[

            cabecalho.join(","),

            ...linhas

        ].join("\n");

        const blob=new Blob(

            [csv],

            {

                type:"text/csv;charset=utf-8;"

            }

        );

        const link=document.createElement("a");

        link.href=URL.createObjectURL(blob);

        link.download=nomeColecao+".csv";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

    }

    catch(e){

        console.error(e);

        alert("Erro ao exportar "+nomeColecao);

    }

}

async function exportarTudo(){

    await exportarColecao("usuarios");

    await new Promise(r=>setTimeout(r,700));

    await exportarColecao("jogos");

    await new Promise(r=>setTimeout(r,700));

    await exportarColecao("palpites");

    alert("Backup concluído!");

}

window.exportarUsuarios=()=>exportarColecao("usuarios");

window.exportarJogos=()=>exportarColecao("jogos");

window.exportarPalpites=()=>exportarColecao("palpites");

window.exportarTudo=exportarTudo;

</script>

</body>

</html>
